name: Deploy to Bloxity

# Builds the frontend and uploads it to Bloxity Hosting (https://hosting.bloxity.io/docs).
# main -> prod channel (https://build-the-skyscraper.play.bloxity.io), dev -> dev channel.
# The game ID is the slug `build-the-skyscraper` (GAME_SLUG in src/config.js, same as the
# backend repo). Only LEGION_DEPLOY_TOKEN (secret) must be set; LEGION_GAME_ID (variable or
# secret) is an optional override and normally left unset.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  GAME_ID: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID || 'build-the-skyscraper' }}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy config
        run: |
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          echo "Deploying game '${GAME_ID}' to the ${{ steps.channel.outputs.channel }} channel"
        env:
          DEPLOY_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}

      - name: Build
        # VITE_DEV_MODE is deliberately unset so deployed builds use the real Bloxity SDK/CDN.
        # No server URL: built games always reach Build-the-skyscraper-backend through the
        # Bloxity matchmaker (Legion.SDK.net.resolveEndpoint in src/bloxity.js).
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - name: Upload to Bloxity
        run: |
          curl -sS -f -X POST \
            "https://api.bloxity.io/v1/hosting/games/${{ env.GAME_ID }}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${{ secrets.LEGION_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
